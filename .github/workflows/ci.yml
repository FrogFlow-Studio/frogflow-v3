name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Живые тесты в одной базе с ночным прогоном — по очереди, не вместе.
    concurrency:
      group: live-db
      cancel-in-progress: false
    # tsc по всему проекту не помещается в куче Node по умолчанию (~2 ГБ на раннере):
    # падал с «JavaScript heap out of memory» на typecheck.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      # Интеграционные тесты (tests/integration) ходят в настоящую базу и
      # сами пропускают себя, если секреты не заданы.
      - run: npm test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          APP_URL: https://ci.invalid
          SECRETS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SESSION_SECRET: ci-session-secret-ci-session-secret-0000
          WEBHOOK_SECRET: ci-webhook-secret-ci-webhook-secret-0000
          CRON_SECRET: ci-cron-secret-0000
          OPERATOR_USERNAME: operator
          OPERATOR_PASSWORD: ci-operator-password
      - run: npx vite build
        env:
          APP_URL: https://ci.invalid

  # Сквозной прогон в браузере: собранное приложение против подставной базы
  # с демо-магазином (tests/e2e/pg-stub.ts, seed.ts) — ключи настоящей базы здесь не нужны.
  # Разбит на 4 параллельных части (--shard): одним заходом шёл ~14 минут.
  # У каждой части своя сборка и своя подставная база.
  e2e-shard:
    name: e2e ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
        env:
          NITRO_PRESET: node-server
          APP_URL: https://ci.invalid
      - run: npm run e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # Общий итог частей под прежним именем «e2e»: на него может ссылаться защита ветки.
  e2e:
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always()
    steps:
      - run: test "${{ needs.e2e-shard.result }}" = success
