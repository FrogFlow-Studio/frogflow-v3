name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    # tsc по всему проекту не помещается в куче Node по умолчанию (~2 ГБ на раннере):
    # падал с «JavaScript heap out of memory» на typecheck.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Живые тесты (tests/integration) — в задаче live ниже.
      - run: npx vitest run --exclude "tests/integration/**"
      - run: npx vite build
        env:
          APP_URL: https://ci.invalid

  # Живые тесты (tests/integration) ходят в настоящую базу, в одного
  # демо-клиента, поэтому по очереди с ночным прогоном (группа live-db).
  # Гоняются после вливания в master (решение Якова, 08.10.2026): в PR
  # очередь из нескольких веток отменяла ждущие проверки.
  live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: live-db
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/integration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          APP_URL: https://ci.invalid
          SECRETS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SESSION_SECRET: ci-session-secret-ci-session-secret-0000
          WEBHOOK_SECRET: ci-webhook-secret-ci-webhook-secret-0000
          CRON_SECRET: ci-cron-secret-0000
          OPERATOR_USERNAME: operator
          OPERATOR_PASSWORD: ci-operator-password

  # Сквозной прогон в браузере: собранное приложение против подставной базы
  # с демо-магазином (tests/e2e/pg-stub.ts, seed.ts) — ключи настоящей базы здесь не нужны.
  # Разбит на 4 параллельных части (--shard): одним заходом шёл ~14 минут.
  # У каждой части своя сборка и своя подставная база.
  e2e-shard:
    name: e2e ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
        env:
          NITRO_PRESET: node-server
          APP_URL: https://ci.invalid
      - run: npm run e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # Общий итог частей под прежним именем «e2e»: на него может ссылаться защита ветки.
  e2e:
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always()
    steps:
      - run: test "${{ needs.e2e-shard.result }}" = success
